config:
  credentials: []
  project_repos:
    github.com/EGI-Federation/eosc-application-deployment-manager:
      branch: main
      repo: https://github.com/EGI-Federation/eosc-application-deployment-manager.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EGI-Federation/eosc-application-deployment-manager git:
        commands:
        - /usr/bin/env sh .sqa/script.gunmetal_funny_spren.sh
        container: qc.acc_tangerine_sweet_echidna
  QC.Doc:
    repos:
      github.com/EGI-Federation/eosc-application-deployment-manager find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.snow_loving_catfish.sh
        container: qc.doc_storm_rugged_kangaroo
      github.com/EGI-Federation/eosc-application-deployment-manager git:
        commands:
        - /usr/bin/env sh .sqa/script.saffron_careful_kingfisher.sh
        container: qc.doc_storm_logical_crocodile
      github.com/EGI-Federation/eosc-application-deployment-manager markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_eccentric_dhole.sh
        container: qc.doc_flax_restless_jackal
  QC.Lic:
    repos:
      github.com/EGI-Federation/eosc-application-deployment-manager licensee:
        commands:
        - /usr/bin/env sh .sqa/script.onyx_forgiving_chipmunk.sh
        container: qc.lic_marigold_patient_porcupine
  QC.Ver:
    repos:
      github.com/EGI-Federation/eosc-application-deployment-manager get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cardamom_melancholy_piranha.sh
        container: qc.ver_gunmetal_apprehensive_mink
timeout: 5400
